# Deploy gitview-landing to gitview.ai (Hetzner landing only).
# Does not deploy teamster / app.gitview.com — that host is separate.
#
# First production run: set secrets on the `landing` GitHub Environment,
# require a reviewer on that environment, then merge to main / dispatch.

name: Deploy landing

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-landing-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy gitview.ai
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: landing
      url: https://gitview.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Hetzner landing
        env:
          LANDING_SSH_PRIVATE_KEY: ${{ secrets.LANDING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${LANDING_SSH_PRIVATE_KEY}" ]]; then
            echo "Missing GitHub secret LANDING_SSH_PRIVATE_KEY." >&2
            echo "Add it on the landing environment (Settings → Environments → landing)." >&2
            exit 1
          fi

          umask 077
          KEY_FILE="${RUNNER_TEMP}/landing_deploy_key"
          printf '%s\n' "${LANDING_SSH_PRIVATE_KEY}" | sed 's/\r$//' > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"
          export LANDING_SSH_KEY_FILE="${KEY_FILE}"

          ./deploy/landing/deploy.sh \
            --server hetzner-landing-1 \
            --apply \
            --no-confirm \
            --local \
            --ref "${GITHUB_SHA}"
